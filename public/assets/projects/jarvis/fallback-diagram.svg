<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Quando a LLM não responde</title><desc>Diagrama editorial baseado em código público. Não é captura de uma execução ou resultado RAG.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a59"/></marker></defs><rect width="1920" height="1080" fill="#f1eddf"/><g font-family="DejaVu Sans, sans-serif" fill="#304b3e"><text x="90" y="95" font-size="28" letter-spacing="4">JARVIS ACADÊMICO / DIAGRAMA</text><text x="90" y="196" font-size="60" font-weight="600">Quando a LLM não responde</text><text x="90" y="258" font-size="31" fill="#657064">O fallback recupera trechos locais e comunica os limites da evidência.</text><path d="M90 300H1830" stroke="#c8cebd" stroke-width="2"/><rect x="90" y="368" width="470" height="248" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="120" y="415" font-size="25" fill="#738577">ENTRADA</text><text x="120" y="472" font-size="40" font-weight="600">Falha técnica</text><text x="120" y="534" font-size="28">Na decisão de ferramentas</text><text x="120" y="578" font-size="28">Heurística acadêmica</text><path d="M580 490L676 490" stroke="#536a59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="700" y="368" width="520" height="248" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="730" y="415" font-size="25" fill="#738577">PERGUNTA ACADÊMICA</text><text x="730" y="472" font-size="40" font-weight="600">Buscar material</text><text x="730" y="534" font-size="28">buscar_material_rag</text><text x="730" y="578" font-size="28">sem_llm = true</text><path d="M1240 490L1324 490" stroke="#536a59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1350" y="368" width="480" height="248" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="1380" y="415" font-size="25" fill="#738577">COM EVIDÊNCIA</text><text x="1380" y="472" font-size="40" font-weight="600">Trecho + fonte</text><text x="1380" y="534" font-size="28">Resposta extrativa</text><text x="1380" y="578" font-size="28">Sem síntese da LLM</text><path d="M960 634V722H1335" stroke="#536a59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1360" y="730" font-size="32" font-weight="600">Sem evidência?</text><text x="1360" y="777" font-size="28">Informar que não encontrou.</text><text x="90" y="753" font-size="31" font-weight="600">Mensagem casual → aviso de indisponibilidade</text><text x="90" y="864" font-size="30">Sem fonte, o fluxo não inventa contexto nem resultados.</text><path d="M90 947H1830" stroke="#c8cebd" stroke-width="2"/><text x="90" y="1000" font-size="25" fill="#657064">Fonte: TeoZ08/jarvis-academico · código e documentação · revisão 76b3018</text></g></svg>