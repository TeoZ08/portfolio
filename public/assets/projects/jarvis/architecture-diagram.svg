<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Da pergunta ao contexto</title><desc>Diagrama editorial baseado em código público. Não é captura de uma execução ou resultado RAG.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536a59"/></marker></defs><rect width="1920" height="1080" fill="#f1eddf"/><g font-family="DejaVu Sans, sans-serif" fill="#304b3e"><text x="90" y="95" font-size="28" letter-spacing="4">JARVIS ACADÊMICO / DIAGRAMA</text><text x="90" y="196" font-size="60" font-weight="600">Da pergunta ao contexto</text><text x="90" y="258" font-size="31" fill="#657064">Recuperação e ferramentas tornam o caminho da resposta visível.</text><path d="M90 300H1830" stroke="#c8cebd" stroke-width="2"/><rect x="90" y="380" width="510" height="294" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="120" y="427" font-size="25" fill="#738577">01 / MATERIAIS</text><text x="120" y="484" font-size="40" font-weight="600">Documentos</text><text x="120" y="546" font-size="28">MD, TXT e PDF</text><text x="120" y="590" font-size="28">Chunks antes da busca</text><text x="120" y="634" font-size="28">Base acadêmica cadastrada</text><path d="M617 525L690 525" stroke="#536a59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="710" y="380" width="510" height="294" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="740" y="427" font-size="25" fill="#738577">02 / RECUPERAÇÃO</text><text x="740" y="484" font-size="40" font-weight="600">RAG local</text><text x="740" y="546" font-size="28">Busca lexical BM25</text><text x="740" y="590" font-size="28">Embeddings + FAISS opcionais</text><text x="740" y="634" font-size="28">Trechos, fontes e scores</text><path d="M1237 525L1310 525" stroke="#536a59" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1330" y="380" width="500" height="294" rx="5" fill="#e5e8d9" stroke="#a4b09b" stroke-width="2"/><text x="1360" y="427" font-size="25" fill="#738577">03 / AGENTE</text><text x="1360" y="484" font-size="40" font-weight="600">Resposta auditável</text><text x="1360" y="546" font-size="28">Ferramentas e LLM remota</text><text x="1360" y="590" font-size="28">Contexto recuperado</text><text x="1360" y="634" font-size="28">Logs para o inspector</text><text x="90" y="777" font-size="34" font-weight="600">React / Vite → FastAPI → agente, RAG e ferramentas</text><text x="90" y="842" font-size="30">O diagrama explica a arquitetura; não demonstra uma consulta executada.</text><path d="M90 947H1830" stroke="#c8cebd" stroke-width="2"/><text x="90" y="1000" font-size="25" fill="#657064">Fonte: TeoZ08/jarvis-academico · código e documentação · revisão 76b3018</text></g></svg>